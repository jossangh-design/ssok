# 쏙 공식 배포: v로 시작하는 태그(예: v0.4.0)를 올리면 자동으로 만들고 GitHub Releases에 올린다.
# 필요한 저장소 비밀값(Settings → Secrets and variables → Actions):
#   SSOK_UPDATE_KEY  업데이트 서명용 비밀 키 (tools/make-update-key.cmd로 만든 것)
# 코드 서명(SignPath)이 승인되면 저장소 변수 SIGNPATH_ORGANIZATION_ID와 비밀값 SIGNPATH_API_TOKEN을 넣는다.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '시험 빌드 버전 (예: 0.4.0). 배포는 하지 않음'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 버전 정하기
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "버전 형식이 아닙니다: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 업데이트 공개 키 만들기 (비밀 키에서)
        id: key
        shell: pwsh
        env:
          SSOK_UPDATE_KEY: ${{ secrets.SSOK_UPDATE_KEY }}
        run: |
          if (-not $env:SSOK_UPDATE_KEY) { Write-Host '업데이트 키가 없어 업데이트 기능 없이 만듭니다.'; exit 0 }
          $k = [System.Security.Cryptography.ECDsa]::Create()
          $k.ImportPkcs8PrivateKey([Convert]::FromBase64String($env:SSOK_UPDATE_KEY), [ref]0)
          $pub = [Convert]::ToBase64String($k.ExportSubjectPublicKeyInfo())
          "public=$pub" >> $env:GITHUB_OUTPUT

      - name: Inno Setup 준비
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: 만들기·시험
        shell: pwsh
        env:
          SSOK_UPDATE_REPO: ${{ steps.key.outputs.public && github.repository || '' }}
          SSOK_UPDATE_PUBLIC_KEY: ${{ steps.key.outputs.public }}
        run: ./build.ps1 -CI -Version ${{ steps.ver.outputs.version }}

      - name: 시험 기록 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-log.txt
            build-selftest.txt

      # ── 코드 서명 (SignPath Foundation 승인 뒤에 켜짐) ──────────────────
      - name: 서명할 파일 올리기
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: release/Ssok-Setup-${{ steps.ver.outputs.version }}.exe

      - name: SignPath 서명
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ssok
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signed

      - name: 서명된 파일로 바꾸기
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: Copy-Item release-signed\*.exe release\ -Force

      # ── 업데이트 정보(update.json)와 서명 ─────────────────────────────
      - name: update.json 만들고 서명하기
        if: steps.key.outputs.public != ''
        shell: pwsh
        env:
          SSOK_UPDATE_KEY: ${{ secrets.SSOK_UPDATE_KEY }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $setup = "release\Ssok-Setup-$v.exe"
          $info = [ordered]@{
            version = $v
            setup   = "https://github.com/${{ github.repository }}/releases/download/v$v/Ssok-Setup-$v.exe"
            sha256  = (Get-FileHash $setup -Algorithm SHA256).Hash
            size    = (Get-Item $setup).Length
            notes   = "쏙 $v"
          }
          $json = $info | ConvertTo-Json -Compress
          $bytes = [Text.Encoding]::UTF8.GetBytes($json)
          [IO.File]::WriteAllBytes("release\update.json", $bytes)
          $k = [System.Security.Cryptography.ECDsa]::Create()
          $k.ImportPkcs8PrivateKey([Convert]::FromBase64String($env:SSOK_UPDATE_KEY), [ref]0)
          $sig = [Convert]::ToBase64String($k.SignData($bytes, [System.Security.Cryptography.HashAlgorithmName]::SHA256))
          [IO.File]::WriteAllText("release\update.json.sig", $sig)

      - name: 지문 목록
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object Name -notlike 'update.json*' |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Set-Content release\SHA256SUMS.txt -Encoding utf8

      - name: 시험 빌드 파일 올리기
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/

      - name: GitHub Releases에 올리기
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $notes = @"
          ## 쏙 $v 내려받기

          - **설치판(추천)**: ``Ssok-Setup-$v.exe`` — 내려받아 실행하면 설치됩니다. 관리자 권한이 필요 없고, 새 버전이 나오면 쏙 안에서 바로 업데이트됩니다.
          - **무설치판**: ``Ssok-Portable-$v.zip`` — 압축을 풀고 ``Ssok.exe``를 실행하세요. USB에 넣어 다녀도 됩니다.

          파일은 이 컴퓨터 안에서만 처리되며 인터넷으로 보내지 않습니다.
          "@
          gh release create "v$v" (Get-ChildItem release -File).FullName --title "쏙 $v" --notes $notes
